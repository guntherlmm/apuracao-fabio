<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Apuração SC · Fabio Botelho 20020</title>
<style>html,body{margin:0;height:100%;background:#0f2338;color:#eef3f8;font:20px Segoe UI,sans-serif;overflow:hidden}
#m{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center}
iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#0f2338}</style>
</head><body><p id="m">Abrindo a apuração…</p>
<script>
fetch("url.json?"+Date.now(),{cache:"no-store"}).then(r=>r.json()).then(j=>{
  var f=document.createElement("iframe");f.src=j.url;f.allow="fullscreen";document.body.appendChild(f);
}).catch(()=>{document.getElementById("m").textContent="Apuração temporariamente indisponível. Tente novamente em instantes."});
</script></body></html>
